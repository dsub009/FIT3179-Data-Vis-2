<!DOCTYPE html>

<head>

  <title>FIT3179 Visualization 2</title>

  <!-- Include Vega & Vega-Lite libraries -->

  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>

  <h1>FIT3179 Data Visualisation 2</h1>
  <p>Student ID: 35097698</p>

  <!-- Container for the chart -->
  <div id="vis"></div>

  <script type="text/javascript">
    // Embed the Vega-Lite specification from your JSON file
    var spec = "daily_cost_bar_chart.vg.json";
    vegaEmbed('#vis', spec).then(function(result) {
      // Access the Vega view instance as result.view
    }).catch(console.error);
  </script>

</body>
